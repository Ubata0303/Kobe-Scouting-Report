        :root {

            --tbl-header-bg: #94a3b8;

        * {

            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 3rem 1rem;

            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            color: #991b1b;
            font-weight: 500;
        }

        /* Table */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
            border: 2px solid #94a3b8; /* Outer border */

        th, td {

        }

        .personnel-cell {

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const resultsContainer = document.getElementById('results-container');
            const resultsTable = document.getElementById('results-table');
            const resetBtn = document.getElementById('reset-btn');
            const errorMsg = document.getElementById('error-message');

            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleFile(e.target.files[0]);
                }
            });

            resetBtn.addEventListener('click', () => {
                resultsContainer.classList.add('hidden');
                dropZone.classList.remove('hidden');
                fileInput.value = '';
                errorMsg.classList.add('hidden');
            });

            function showError(message) {
                errorMsg.innerHTML = message.replace(/\n/g, '<br>');
                errorMsg.classList.remove('hidden');
            }

            function handleFile(file) {
                if (!file.name.match(/\.(xlsx|xls|csv)$/i)) {
                    showError('ExcelまたはCSVファイルを選択してください。');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        if (jsonData.length < 2) throw new Error("データがありません。");
                        
                        processExcelData(jsonData);
                        
                        dropZone.classList.add('hidden');
                        resultsContainer.classList.remove('hidden');
                        errorMsg.classList.add('hidden');
                    } catch (err) {
                        console.error(err);
                        showError('ファイルの読み込みに失敗しました:\n' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function findColumnIndices(headers) {
                let personnelIdx = -1;
                let formationIdx = -1;
                let typeIdx = -1; 
                let playIdx = -1; 

                for (let i = 0; i < headers.length; i++) {
                    if (!headers[i]) continue;
                    const header = String(headers[i]).toUpperCase();
                    
                    if (personnelIdx === -1 && (header.includes('PERSONNE') || header.includes('PERSONEL'))) {
                        personnelIdx = i;
                    }
                    if (formationIdx === -1 && (header.includes('OFF FORM') || header.includes('FORMATION'))) {
                        formationIdx = i;
                    }
                    if (typeIdx === -1 && header.includes('PLAY TYPE(D)')) {
                        typeIdx = i;
                    }
                    if (playIdx === -1 && (header.includes('OFF PLAY') || header === 'PLAY' || header === 'OFFPLAY')) {
                        playIdx = i;
                    }
                }
                
                return { personnelIdx, formationIdx, typeIdx, playIdx };
            }

            function escapeHTML(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function processExcelData(rows) {
                let headerRowIdx = 0;
                let bestMatchCount = 0;
                let bestIndices = { personnelIdx: -1, formationIdx: -1, typeIdx: -1, playIdx: -1 };

                // Scan to find headers
                for (let r = 0; r < Math.min(50, rows.length); r++) {
                    const currentHeaders = rows[r] || [];
                    const indices = findColumnIndices(currentHeaders);
                    let matchCount = 0;
                    if (indices.personnelIdx !== -1) matchCount++;
                    if (indices.formationIdx !== -1) matchCount++;
                    if (indices.typeIdx !== -1) matchCount++;
                    if (indices.playIdx !== -1) matchCount++;

                    if (matchCount > bestMatchCount) {
                        bestMatchCount = matchCount;
                        bestIndices = indices;
                        headerRowIdx = r;
                    }
                }

                const { personnelIdx, formationIdx, typeIdx, playIdx } = bestIndices;

                if (personnelIdx === -1 || typeIdx === -1 || playIdx === -1 || formationIdx === -1) {
                    let foundHeaders = rows[headerRowIdx] ? rows[headerRowIdx].join(', ') : 'なし';
                    throw new Error(`必要な列が見つかりません。見つかった列: Per(${personnelIdx!==-1}), Form(${formationIdx!==-1}), Type(${typeIdx!==-1}), Play(${playIdx!==-1})\n読み込んだヘッダー: ${foundHeaders.substring(0, 100)}`);
                }

                const stats = {};
                let processedCount = 0;
                let debugSkips = { empty: 0, punt: 0, notRPR: 0 };

                for (let i = headerRowIdx + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    let personnel = row[personnelIdx];
                    let formation = row[formationIdx];
                    let type = row[typeIdx];
                    let play = row[playIdx];

                    if (personnel == null || type == null || play == null || formation == null || 
                        personnel === '' || type === '' || play === '' || formation === '') {
                        debugSkips.empty++;
                        continue;
                    }
                    
                    personnel = escapeHTML(String(personnel).trim());
                    formation = escapeHTML(String(formation).trim());
                    type = String(type).trim().toUpperCase();
                    play = escapeHTML(String(play).trim());

                    if (type.includes('PUNT') || type.includes('KICK') || type.includes('FG') || type.includes('フィールドゴール')) {
                        debugSkips.punt++;
                        continue;
                    }
                    
                    let isRPO = type.includes('RPO');
                    // Only count as pure Run/Pass if it's NOT an RPO
                    let isRun = !isRPO && (type.includes('RUN') || type === 'R' || type.includes('ラン'));
                    let isPass = !isRPO && (type.includes('PASS') || type === 'P' || type.includes('パス'));

                    if (!isRPO && !isRun && !isPass) {
                        debugSkips.notRPR++;
                        continue;
                    }

                    const category = isRPO ? 'rpo' : (isPass ? 'pass' : 'run');

                    if (!stats[personnel]) {
                        stats[personnel] = {
                            total: 0,
                            categories: { run: 0, pass: 0, rpo: 0 },
                            formations: {}
                        };
                    }

                    stats[personnel].total++;
                    stats[personnel].categories[category]++;

                    if (!stats[personnel].formations[formation]) {
                        stats[personnel].formations[formation] = {
                            total: 0,
                            categories: { 
                                run: { count: 0, plays: {} }, 
                                pass: { count: 0, plays: {} }, 
                                rpo: { count: 0, plays: {} } 
                            }
                        };
                    }

                    stats[personnel].formations[formation].total++;
                    stats[personnel].formations[formation].categories[category].count++;
                    
                    if (!stats[personnel].formations[formation].categories[category].plays[play]) {
                        stats[personnel].formations[formation].categories[category].plays[play] = 0;
                    }
                    stats[personnel].formations[formation].categories[category].plays[play]++;
                    
                    processedCount++;
                }

                if (processedCount === 0) {
                    throw new Error(`データが1件も集計されませんでした。\n[デバッグ情報]\n特定列: Per=${personnelIdx}, Form=${formationIdx}, Type=${typeIdx}, Play=${playIdx}\nスキップ: 空白=${debugSkips.empty}, Punt=${debugSkips.punt}, 判定不可=${debugSkips.notRPR}`);
                }

                const headersRow = rows[headerRowIdx];
                const perHeaderName = headersRow[personnelIdx];
                const formHeaderName = headersRow[formationIdx];
                const typeHeaderName = headersRow[typeIdx];
                const debugText = `【デバッグ】見出し行:${headerRowIdx + 1} | Personnel列:[${personnelIdx + 1}]${perHeaderName} | Formation列:[${formationIdx + 1}]${formHeaderName} | PlayType列:[${typeIdx + 1}]${typeHeaderName} | 集計対象プレイ数:${processedCount}`;
                const totalSpan = document.getElementById("total-play-count");
                totalSpan.innerText = debugText;
                totalSpan.style.display = "block";
                totalSpan.style.fontSize = "0.85rem";
                totalSpan.style.marginTop = "4px";
                totalSpan.style.fontWeight = "normal";
                renderTable(stats, processedCount);
            }

            function getPct(count, total) {
                if (total === 0) return "0.0%";
                const pct = (count / total) * 100;
                const pctStr = pct.toFixed(1) + "%";
                if (pct >= 70) {
                    return `<span style="font-weight: 900;">${pctStr}</span>`;
                }
                return pctStr;
            }

            function getProportionPct(count, total) {
                if (total === 0) return "0.0%";
                const pct = (count / total) * 100;
                const pctStr = pct.toFixed(1) + "%";
                if (pct >= 70) {
                    return `<span style="color: #dc2626; font-weight: 900;">${pctStr}</span>`;
                }
                return pctStr;
            }


            function getBgClass(type, count, total) {
                if (total === 0) return "";
                const pct = (count / total) * 100;
                if (pct >= 70) {
                    if (type === 'pass') return 'bg-pass-high';
                    if (type === 'run') return 'bg-run-high';
                    if (type === 'rpo') return 'bg-rpo-high';
                }
                return "";
            }

            function formatPlays(playsObj) {
                const sorted = Object.entries(playsObj).sort((a, b) => b[1] - a[1]);
                if (sorted.length === 0) return '';
                return sorted.map(([play, count]) => {
                    return `<span class="play-item">${play} <span class="play-count">(${count})</span></span>`;
                }).join(', ');
            }

            function renderTable(stats, processedCount) {
                const existingTbodys = resultsTable.querySelectorAll('tbody');
                existingTbodys.forEach(tb => tb.remove());
                
                const personnelKeys = Object.keys(stats).sort((a, b) => stats[b].total - stats[a].total);
                
                // Generate visibility checkboxes
                const visibilityContainer = document.getElementById('visibility-controls');
                if (visibilityContainer) {
                    visibilityContainer.innerHTML = '<strong>表示するPersonnel:</strong> ';
                    personnelKeys.forEach((per, pIdx) => {
                        const label = document.createElement('label');
                        label.style.marginRight = '12px';
                        label.style.cursor = 'pointer';
                        label.innerHTML = `<input type="checkbox" checked onchange="document.getElementById('personnel-block-${pIdx}').style.display = this.checked ? '' : 'none';"> ${per}`;
                        visibilityContainer.appendChild(label);
                    });
                }

                personnelKeys.forEach((per, pIdx) => {
                    const data = stats[per];
                    const forms = Object.keys(data.formations).sort((a, b) => data.formations[b].total - data.formations[a].total);
                    
                    const formCount = forms.length;
                    const personnelRowspan = 3 + (formCount * 3);
                    const blockBorderClass = "border-bottom-thick";

                    const tbody = document.createElement('tbody');
                    tbody.className = 'personnel-tbody';
                    tbody.id = 'personnel-block-' + pIdx;

                    let html = `
                        <tr style="border-top: 2px solid #94a3b8;">
                            <td rowspan="${personnelRowspan}" class="personnel-cell">
                                ${per}
                                <button class="camera-btn" onclick="exportImage('${tbody.id}', '${per}')">📷 画像化</button>
                            </td>
                            <td rowspan="${personnelRowspan}" class="input-cell"><textarea class="editable-field" placeholder="入力..."></textarea></td>
                            <td rowspan="${personnelRowspan}" class="input-cell"><textarea class="editable-field" placeholder="入力..."></textarea></td>
                            <td rowspan="3" colspan="2" style="font-weight:600; text-align:center;">
                                合計<br><span class="count-text" style="font-weight:normal;">(${data.total}/${processedCount})</span>
                            </td>
                            <td class="type-cell type-pass ${getBgClass('pass', data.categories.pass, data.total)}">Pass</td>
                            <td class="percent-cell ${getBgClass('pass', data.categories.pass, data.total)}">${getPct(data.categories.pass, data.total)}</td>
                            <td class="plays-cell ${getBgClass('pass', data.categories.pass, data.total)}"></td>
                        </tr>
                        <tr>
                            <td class="type-cell type-run ${getBgClass('run', data.categories.run, data.total)}">Run</td>
                            <td class="percent-cell ${getBgClass('run', data.categories.run, data.total)}">${getPct(data.categories.run, data.total)}</td>
                            <td class="plays-cell ${getBgClass('run', data.categories.run, data.total)}"></td>
                        </tr>
                        <tr>
                            <td class="type-cell type-rpo ${getBgClass('rpo', data.categories.rpo, data.total)}">RPO</td>
                            <td class="percent-cell ${getBgClass('rpo', data.categories.rpo, data.total)}">${getPct(data.categories.rpo, data.total)}</td>
                            <td class="plays-cell ${getBgClass('rpo', data.categories.rpo, data.total)}"></td>
                        </tr>
                    `;

                    forms.forEach((form, fIdx) => {
                        let fData = data.formations[form];
                        let trClass = (fIdx === forms.length - 1) ? blockBorderClass : "";

                        html += `
                            <tr>
                                <td rowspan="3" class="formation-name">
                                    <label style="cursor: pointer; display: block; width: 100%;">
                                        <span>${form}</span>
                                        <input type="checkbox" checked class="form-checkbox camera-btn" style="float: right; margin-top: 2px;">
                                    </label>
                                </td>
                                <td rowspan="3" class="formation-percent">${getProportionPct(fData.total, data.total)}<br><span class="count-text">(${fData.total}/${data.total})</span></td>
                                <td class="type-cell type-pass ${getBgClass('pass', fData.categories.pass.count, fData.total)}">Pass</td>
                                <td class="percent-cell ${getBgClass('pass', fData.categories.pass.count, fData.total)}">${getPct(fData.categories.pass.count, fData.total)}</td>
                                <td class="plays-cell ${getBgClass('pass', fData.categories.pass.count, fData.total)}">${formatPlays(fData.categories.pass.plays)}</td>
                            </tr>
                            <tr>
                                <td class="type-cell type-run ${getBgClass('run', fData.categories.run.count, fData.total)}">Run</td>
                                <td class="percent-cell ${getBgClass('run', fData.categories.run.count, fData.total)}">${getPct(fData.categories.run.count, fData.total)}</td>
                                <td class="plays-cell ${getBgClass('run', fData.categories.run.count, fData.total)}">${formatPlays(fData.categories.run.plays)}</td>
                            </tr>
                            <tr class="${trClass}">
                                <td class="type-cell type-rpo ${getBgClass('rpo', fData.categories.rpo.count, fData.total)}">RPO</td>
                                <td class="percent-cell ${getBgClass('rpo', fData.categories.rpo.count, fData.total)}">${getPct(fData.categories.rpo.count, fData.total)}</td>
                                <td class="plays-cell ${getBgClass('rpo', fData.categories.rpo.count, fData.total)}">${formatPlays(fData.categories.rpo.plays)}</td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML = html;
                    resultsTable.appendChild(tbody);
                });
            }

            window.exportImage = function(targetTbodyId, perName) {
                const allTbodys = document.querySelectorAll('.personnel-tbody');
                allTbodys.forEach(tb => {
                    if(tb.id !== targetTbodyId) {
                        tb.style.display = 'none';
                    }
                });
                
                const thead = document.querySelector('thead');
                if (thead) thead.style.display = 'none';
                
                const buttons = document.querySelectorAll('.camera-btn');
                buttons.forEach(btn => btn.style.display = 'none');
                
                // Handle unchecked formations for this specific tbody
                const tbody = document.getElementById(targetTbodyId);
                const formCheckboxes = tbody.querySelectorAll('.form-checkbox');
                const hiddenRows = [];
                const modifiedRowspans = new Map();

                formCheckboxes.forEach(cb => {
                    if (!cb.checked) {
                        const tr1 = cb.closest('tr');
                        const tr2 = tr1.nextElementSibling;
                        const tr3 = tr2.nextElementSibling;
                        
                        tr1.style.display = 'none';
                        tr2.style.display = 'none';
                        tr3.style.display = 'none';
                        hiddenRows.push(tr1, tr2, tr3);
                        
                        const firstTr = tbody.firstElementChild;
                        const personnelCell = firstTr.querySelector('.personnel-cell');
                        const inputCells = firstTr.querySelectorAll('.input-cell');
                        
                        if (!modifiedRowspans.has(personnelCell)) {
                            modifiedRowspans.set(personnelCell, parseInt(personnelCell.getAttribute('rowspan')));
                        }
                        
                        let currentSpan = parseInt(personnelCell.getAttribute('rowspan'));
                        personnelCell.setAttribute('rowspan', currentSpan - 3);
                        inputCells.forEach(cell => {
                            cell.setAttribute('rowspan', currentSpan - 3);
                        });
                    }
                });

                const tableWrapper = document.querySelector('.table-wrapper');
                
                html2canvas(tableWrapper, {
                    backgroundColor: '#ffffff',
                    scale: 2 
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'Tendency_' + perName + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    // Restore everything
                    allTbodys.forEach(tb => tb.style.display = '');
                    if (thead) thead.style.display = '';
                    buttons.forEach(btn => btn.style.display = '');
                    
                    hiddenRows.forEach(tr => tr.style.display = '');
                    modifiedRowspans.forEach((origSpan, pCell) => {
                        pCell.setAttribute('rowspan', origSpan);
                        const firstTr = pCell.closest('tr');
                        firstTr.querySelectorAll('.input-cell').forEach(cell => {
                            cell.setAttribute('rowspan', origSpan);
                        });
                    });
                });
            };


            window.exportAllImage = function() {
                const thead = document.querySelector('thead');
                if (thead) thead.style.display = '';
                
                // Hide camera buttons temporarily
                const buttons = document.querySelectorAll('.camera-btn');
                buttons.forEach(btn => btn.style.display = 'none');
                
                // Handle unchecked formations
                const formCheckboxes = document.querySelectorAll('.form-checkbox');
                const hiddenRows = [];
                const modifiedRowspans = new Map();

                formCheckboxes.forEach(cb => {
                    // Only process if it's unchecked and its parent tbody is not already hidden by personnel checkboxes
                    const tbody = cb.closest('tbody');
                    if (!cb.checked && tbody.style.display !== 'none') {
                        const tr1 = cb.closest('tr');
                        const tr2 = tr1.nextElementSibling;
                        const tr3 = tr2.nextElementSibling;
                        
                        tr1.style.display = 'none';
                        tr2.style.display = 'none';
                        tr3.style.display = 'none';
                        hiddenRows.push(tr1, tr2, tr3);
                        
                        const firstTr = tbody.firstElementChild;
                        const personnelCell = firstTr.querySelector('.personnel-cell');
                        const inputCells = firstTr.querySelectorAll('.input-cell');
                        
                        if (!modifiedRowspans.has(personnelCell)) {
                            modifiedRowspans.set(personnelCell, parseInt(personnelCell.getAttribute('rowspan')));
                        }
                        
                        let currentSpan = parseInt(personnelCell.getAttribute('rowspan'));
                        personnelCell.setAttribute('rowspan', currentSpan - 3);
                        inputCells.forEach(cell => {
                            cell.setAttribute('rowspan', currentSpan - 3);
                        });
                    }
                });
                
                const tableWrapper = document.querySelector('.table-wrapper');
                
                html2canvas(tableWrapper, {
                    backgroundColor: '#ffffff',
                    scale: 2 
                }).then(canvas => {
                    // Restore camera buttons
                    buttons.forEach(btn => btn.style.display = '');
                    
                    // Restore hidden rows and rowspans
                    hiddenRows.forEach(tr => tr.style.display = '');
                    modifiedRowspans.forEach((origSpan, pCell) => {
                        pCell.setAttribute('rowspan', origSpan);
                        const firstTr = pCell.closest('tr');
                        firstTr.querySelectorAll('.input-cell').forEach(cell => {
                            cell.setAttribute('rowspan', origSpan);
                        });
                    });
                    
                    const link = document.createElement('a');
                    link.download = `Personnel_Tendency_All.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            };

            window.exportHeaderImage = function() {
                const allTbodys = document.querySelectorAll('.personnel-tbody');
                allTbodys.forEach(tb => tb.style.display = 'none');
                
                const tableWrapper = document.querySelector('.table-wrapper');
                
                html2canvas(tableWrapper, {
                    backgroundColor: '#ffffff',
                    scale: 2 
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'Tendency_Header.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    allTbodys.forEach(tb => tb.style.display = '');
                });
            };
        });
    </script>
    <script src="menu.js"></script>
    <script src="secure-data.js"></script>
    <script src="shared-data.js"></script>
</body>
